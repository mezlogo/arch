# /efi/loader/loader.conf
#
# systemd-boot configuration for a UKI-only install.
#
# The UKI lives at:
#   /efi/EFI/Linux/arch-linux-lts.efi
#
# systemd-boot derives the entry name from the filename, so the entry
# is called "arch-linux-lts" (no .efi suffix).

# Boot this entry by default.
default arch-linux-lts

# Boot immediately. Set to e.g. 3 if you want a visible menu.
timeout 0

# Disable the interactive boot editor. Leaving this on lets anyone
# with physical access append init=/bin/bash and get a root shell.
editor no

# Prefer the highest resolution the firmware offers.
console-mode max

# Auto-discover other UKIs in /efi/EFI/Linux (default: yes).
#auto-entries yes

# Show firmware boot entries (default: yes).
#auto-firmware yes
